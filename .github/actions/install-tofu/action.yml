name: Install OpenTofu
description: >-
  Install the OpenTofu of scripts/lib/tools.sh (TOFU_VERSION) with its sha256 and put it first on PATH,
  the same as the CodeBuild buildspecs. Run actions/checkout before this.
runs:
  using: composite
  steps:
    - name: Install OpenTofu
      shell: bash
      run: |
        scripts/install/install-tofu.sh
        # The buildspecs put the same directories first on PATH; GITHUB_PATH takes one directory per line
        bash -c '. scripts/lib/tools.sh && tools_path' | tr : '\n' >> "$GITHUB_PATH"

    # A lost or wrong GITHUB_PATH line would otherwise pass with whatever tofu the runner has
    - name: Check the OpenTofu version
      shell: bash
      run: |
        . scripts/lib/tools.sh
        got=$(tofu version -json | jq -r .terraform_version)
        if [ "$got" != "${TOFU_VERSION#v}" ]; then
          echo "::error::tofu on PATH is $got, not ${TOFU_VERSION#v} of scripts/lib/tools.sh"
          exit 1
        fi
        tofu version
