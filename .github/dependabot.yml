# PRs target develop (the integration branch); main only receives changes via
# the develop → main release PR, so dependency bumps must land on develop first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/cdk"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
    ignore:
      # @types/node must track the Node.js runtime major (currently 24);
      # bump manually when the runtime is upgraded
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "terraform"
    directory: "/opentofu"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      terraform-providers:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
