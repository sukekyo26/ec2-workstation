name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  validate-config:
    name: Validate workstation-config
    runs-on: ubuntu-latest
    # An explicit bash runs with -eo pipefail, so a missing file fails the size check instead of measuring 0 bytes
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install jv
        run: scripts/install-jv.sh

      - name: Validate against JSON Schema
        run: scripts/validate-config.sh

      # The script tests use a fake jv, so check here that the real jv rejects a broken config and
      # a misspelled schema keyword (which jv alone would ignore). Each copy gets the jv installed above;
      # it must not download its own
      - name: Check the real jv rejects a broken config and schema typos
        run: |
          shopt -s inherit_errexit
          jv=$(bash -c '. scripts/lib/tofu-common.sh; jv_path')
          # copy <jq filter for the config> <jq filter for the schema>: a repository copy with the jv
          copy() {
            local dir
            dir=$(mktemp -d)
            cp -R scripts schemas "$dir/"
            jq "$1" workstation-config.json > "$dir/workstation-config.json"
            jq "$2" workstation-config.schema.json > "$dir/workstation-config.schema.json"
            install -D "$jv" "$dir/${jv#"$PWD/"}"
            echo "$dir"
          }
          # expect <dir> <line>...: validate-config.sh fails with rc=1 and prints every line
          expect() {
            local dir=$1 out rc=0
            shift
            out=$("$dir/scripts/validate-config.sh" 2>&1) || rc=$?
            echo "$out"
            [ "$rc" = 1 ]
            for line in "$@"; do
              grep -qF -- "$line" <<< "$out"
            done
          }
          expect "$(copy '.autoStopConfig.cpuEvaluationMinutes = 180 | .users[0].username = "default"' .)" \
            "- at '/autoStopConfig/cpuEvaluationMinutes'" "- at '/users/0/username'"
          typo="has a keyword that JSON Schema draft-07 does not know"
          expect "$(copy . '.properties.autoStopConfig.properties.cpuEvaluationMinutes |= (.maximun = .maximum | del(.maximum))')" \
            "- at '/properties/autoStopConfig/properties/cpuEvaluationMinutes': additional properties 'maximun' not allowed" "$typo"
          expect "$(copy . '.properties.users.items.properties.username |= (.patern = .pattern | del(.pattern))')" \
            "- at '/properties/users/items/properties/username': additional properties 'patern' not allowed" "$typo"
          expect "$(copy . '.properties.users |= (.itmes = .items | del(.items))')" \
            "- at '/properties/users': additional properties 'itmes' not allowed" "$typo"

      # The EC2 limit is 16 KB before base64; checking the base64 length leaves headroom for
      # the gzip -9 vs base64gzip difference and the template expansion
      - name: Check user-data fits the EC2 limit (16 KB before base64; base64 length < 16384 for headroom)
        run: |
          size=$(gzip -9 -c opentofu/modules/workstation/templates/user-data.sh.tftpl | base64 -w0 | wc -c)
          echo "user-data (gzip+base64): $size bytes"
          [ "$size" -lt 16384 ]

      - name: Check os enum matches os-images.json
        run: diff <(jq -S '.definitions.os.enum | sort' workstation-config.schema.json) <(jq -S 'keys | sort' opentofu/modules/workstation/os-images.json)

  opentofu:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1

      - name: Format check
        run: tofu fmt -check -recursive
        working-directory: opentofu

      - name: Init (no backend) and validate each root
        shell: bash
        run: |
          for stack in opentofu/stacks/*/; do
            tofu -chdir="$stack" init -backend=false
            tofu -chdir="$stack" validate
          done

  scripts-test:
    name: Deploy scripts test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test deploy/destroy scripts with a fake tofu
        run: scripts/tests/tofu-deploy.test.sh

      - name: Test install-jv.sh with a fake curl
        run: scripts/tests/install-jv.test.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action は pull_request イベントで PR コミット一覧 API を呼ぶため
    # pull-requests: read が必要（デフォルトの read-only トークンには含まれない）
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the entire commit range is scanned
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error
          scandir: "."
          # The action only picks files by shell extensions, so the user-data template needs this
          additional_files: ".sh.tftpl"

  powershell:
    name: PowerShell 5.1
    # Windows PowerShell 5.1 is what the SSH ProxyCommand runs; pwsh 7 accepts syntax that 5.1 rejects
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Parse and analyze scripts/**/*.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/powershell-lint.ps1
