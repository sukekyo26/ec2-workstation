name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  validate-config:
    name: Validate workstation-config
    runs-on: ubuntu-latest
    # An explicit bash runs with -eo pipefail, so a missing file fails the size check instead of measuring 0 bytes
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install jv
        run: scripts/install/install-jv.sh

      - name: Validate against JSON Schema
        run: scripts/validate-config.sh

      # The script tests use a fake jv, so check here that the real jv rejects a broken config and
      # a misspelled schema keyword (which jv alone would ignore). Each copy gets the jv installed above;
      # it must not download its own
      - name: Check the real jv rejects a broken config and schema typos
        run: |
          shopt -s inherit_errexit
          # The path under the repository, so that a copy gets it at the same place
          jv=$(bash -c '. scripts/lib/tools.sh; p=$(jv_path); echo "${p#"$REPO_ROOT/"}"')
          # copy <jq filter for the config> <jq filter for the schema>: a repository copy with the jv
          copy() {
            local dir
            dir=$(mktemp -d)
            cp -R scripts schemas "$dir/"
            jq "$1" workstation-config.json > "$dir/workstation-config.json"
            jq "$2" workstation-config.schema.json > "$dir/workstation-config.schema.json"
            install -D "$jv" "$dir/$jv"
            echo "$dir"
          }
          # expect <dir> <line>...: validate-config.sh fails with rc=1 and prints every line
          expect() {
            local dir=$1 out rc=0
            shift
            out=$("$dir/scripts/validate-config.sh" 2>&1) || rc=$?
            echo "$out"
            [ "$rc" = 1 ]
            for line in "$@"; do
              grep -qF -- "$line" <<< "$out"
            done
          }
          expect "$(copy '.autoStopConfig.cpuEvaluationMinutes = 180 | .users[0].username = "default"' .)" \
            "- at '/autoStopConfig/cpuEvaluationMinutes'" "- at '/users/0/username'"
          typo="has a keyword that JSON Schema draft-07 does not know"
          expect "$(copy . '.properties.autoStopConfig.properties.cpuEvaluationMinutes |= (.maximun = .maximum | del(.maximum))')" \
            "- at '/properties/autoStopConfig/properties/cpuEvaluationMinutes': additional properties 'maximun' not allowed" "$typo"
          expect "$(copy . '.properties.users.items.properties.username |= (.patern = .pattern | del(.pattern))')" \
            "- at '/properties/users/items/properties/username': additional properties 'patern' not allowed" "$typo"
          expect "$(copy . '.properties.users |= (.itmes = .items | del(.items))')" \
            "- at '/properties/users': additional properties 'itmes' not allowed" "$typo"

      # The EC2 limit is 16 KB before base64; checking the base64 length leaves headroom for
      # the gzip -9 vs base64gzip difference and the template expansion
      - name: Check user-data fits the EC2 limit (16 KB before base64; base64 length < 16384 for headroom)
        run: |
          size=$(gzip -9 -c opentofu/modules/workstation/templates/user-data.sh.tftpl | base64 -w0 | wc -c)
          echo "user-data (gzip+base64): $size bytes"
          [ "$size" -lt 16384 ]

      - name: Check os enum matches os-images.json
        run: diff <(jq -S '.definitions.os.enum | sort' workstation-config.schema.json) <(jq -S 'keys | sort' opentofu/modules/workstation/os-images.json)

  opentofu:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install OpenTofu
        uses: ./.github/actions/install-tofu

      - name: Format check
        run: tofu fmt -check -recursive
        working-directory: opentofu

      - name: Init (no backend), validate and test each root
        shell: bash
        run: |
          for stack in opentofu/stacks/*/; do
            tofu -chdir="$stack" init -backend=false
            tofu -chdir="$stack" validate
            tofu -chdir="$stack" test
          done

  scripts-test:
    name: Deploy scripts test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test deploy/destroy scripts with a fake tofu
        run: scripts/tests/tofu-deploy.test.sh

      - name: Test install-jv.sh and install-shfmt.sh with a fake curl
        run: scripts/tests/install-tools.test.sh

      - name: Test format-shell.sh with a fake shfmt
        run: scripts/tests/format-shell.test.sh

      - name: Test start-ec2-and-wait.sh and start-ec2.sh with a fake aws
        run: scripts/tests/start-ec2.test.sh

      - name: Test setup-remote-ssh.sh with a fake aws
        run: scripts/tests/setup-remote-ssh.test.sh

      - name: Test the data volume preparation in user-data with fake e2fsprogs
        run: scripts/tests/data-volume-fs.test.sh

      - name: Test the fstab entries in user-data with the real findmnt
        run: scripts/tests/fstab-entry.test.sh

  shell-format:
    name: Shell format
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install shfmt
        run: scripts/install/install-shfmt.sh

      - name: Check the format of the shell scripts
        run: scripts/format-shell.sh --check

      # format-shell.sh passes no formatting flags so that shfmt reads .editorconfig. If a flag crept back in,
      # changing .editorconfig would change nothing, so check that a copy with indent_size = 2 fails.
      # The copy gets the shfmt installed above; it must not download its own
      - name: Check that shfmt reads .editorconfig
        run: |
          copy=$(mktemp -d)
          git ls-files -z | xargs -0 cp --parents -t "$copy"
          git -C "$copy" init -q
          git -C "$copy" add -A
          sed -i 's/^indent_size = 4$/indent_size = 2/' "$copy/.editorconfig"
          grep -qx 'indent_size = 2' "$copy/.editorconfig"
          shfmt=$(bash -c '. scripts/lib/tools.sh; p=$(shfmt_path); echo "${p#"$REPO_ROOT/"}"')
          install -D "$shfmt" "$copy/$shfmt"
          rc=0
          out=$("$copy/scripts/format-shell.sh" --check 2>&1) || rc=$?
          head -40 <<< "$out"
          [ "$rc" != 0 ]
          grep -qF -- "$copy/opentofu/modules/workstation/templates/user-data.sh.tftpl" <<< "$out"
          grep -qF -- "$copy/scripts/lib/tools.sh" <<< "$out"

  cloudformation:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # LIMIT: cfn-lint is pinned by version, not by hash (it pulls many dependencies)
      - name: Install cfn-lint
        run: pip install cfn-lint==1.59.0

      - name: Lint cloudformation/*.yaml
        run: cfn-lint cloudformation/*.yaml

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action は pull_request イベントで PR コミット一覧 API を呼ぶため
    # pull-requests: read が必要（デフォルトの read-only トークンには含まれない）
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the entire commit range is scanned
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error
          scandir: "."
          # The action only picks files by shell extensions, so the user-data template needs this.
          # Keep it in line with the file list in scripts/format-shell.sh
          additional_files: ".sh.tftpl"

  powershell:
    name: PowerShell 5.1
    # Windows PowerShell 5.1 is what the SSH ProxyCommand runs; pwsh 7 accepts syntax that 5.1 rejects
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Parse and analyze scripts/**/*.ps1
        shell: powershell
        continue-on-error: true
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/powershell-lint.ps1

      - name: Test start-ec2-and-wait.ps1, start-ec2.ps1 and setup-remote-ssh.ps1 with a fake aws
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/start-ec2.test.ps1
