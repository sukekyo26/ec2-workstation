  #
  #     - name: Setup pnpm
  #       uses: pnpm/action-setup@v5
  #       with:
  #         package_json_file: cdk/package.json
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v6
  #       with:
  #         node-version: 24
  #         cache: pnpm
  #         cache-dependency-path: cdk/pnpm-lock.yaml
  #
  #     - name: Install dependencies
  #       run: pnpm install --frozen-lockfile
  #
  #     - name: CDK Synth
  #       run: pnpm synth

  opentofu:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Format check
        run: tofu fmt -check -recursive
        working-directory: opentofu

      - name: Init (no backend)
        run: tofu init -backend=false
        working-directory: opentofu

      - name: Validate
        run: tofu validate
        working-directory: opentofu

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          scandir: "."
