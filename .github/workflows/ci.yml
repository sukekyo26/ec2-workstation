name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  validate-config:
    name: Validate workstation-config
    runs-on: ubuntu-latest
    # An explicit bash runs with -eo pipefail, so a missing file fails the size check instead of measuring 0 bytes
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate against JSON Schema
        run: npx --yes ajv-cli@5 validate -s workstation-config.schema.json -d workstation-config.json

      # The EC2 limit is 16 KB before base64; checking the base64 length leaves headroom for
      # the gzip -9 vs base64gzip difference and the template expansion
      - name: Check user-data fits the EC2 limit (16 KB before base64; base64 length < 16384 for headroom)
        run: |
          size=$(gzip -9 -c opentofu/modules/workstation/templates/user-data.sh.tftpl | base64 -w0 | wc -c)
          echo "user-data (gzip+base64): $size bytes"
          [ "$size" -lt 16384 ]

      - name: Check os enum matches os-images.json
        run: diff <(jq -S '.definitions.os.enum | sort' workstation-config.schema.json) <(jq -S 'keys | sort' opentofu/modules/workstation/os-images.json)

  opentofu:
    name: OpenTofu Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1

      - name: Format check
        run: tofu fmt -check -recursive
        working-directory: opentofu

      - name: Init (no backend) and validate each root
        shell: bash
        run: |
          for stack in opentofu/stacks/*/; do
            tofu -chdir="$stack" init -backend=false
            tofu -chdir="$stack" validate
          done

  scripts-test:
    name: Deploy scripts test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test deploy/destroy scripts with a fake tofu
        run: scripts/tests/tofu-deploy.test.sh

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    # gitleaks-action は pull_request イベントで PR コミット一覧 API を呼ぶため
    # pull-requests: read が必要（デフォルトの read-only トークンには含まれない）
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the entire commit range is scanned
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error
          scandir: "."
          # The action only picks files by shell extensions, so the user-data template needs this
          additional_files: ".sh.tftpl"

  powershell:
    name: PowerShell 5.1
    # Windows PowerShell 5.1 is what the SSH ProxyCommand runs; pwsh 7 accepts syntax that 5.1 rejects
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Parse and analyze scripts/**/*.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/powershell-lint.ps1
