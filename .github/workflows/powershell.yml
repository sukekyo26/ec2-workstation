name: PowerShell

# Windows runners count double minutes on a private repository, so this runs only when the PowerShell
# scripts or their checks change. It is not a required check: a skipped required check would stay pending
on:
  push:
    branches: [develop]
    paths:
      - "scripts/**/*.ps1"
      - "PSScriptAnalyzerSettings.psd1"
      - ".github/workflows/powershell.yml"
  pull_request:
    branches: [develop]
    paths:
      - "scripts/**/*.ps1"
      - "PSScriptAnalyzerSettings.psd1"
      - ".github/workflows/powershell.yml"

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell 5.1
    # Windows PowerShell 5.1 is what the SSH ProxyCommand runs; pwsh 7 accepts syntax that 5.1 rejects
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Parse and analyze scripts/**/*.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/powershell-lint.ps1
