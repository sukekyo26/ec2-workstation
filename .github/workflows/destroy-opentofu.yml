name: Destroy (OpenTofu)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '削除を実行するには "destroy" と入力してください'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Serialize with the deploy workflows so apply/destroy never run concurrently
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  destroy:
    name: OpenTofu Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        if: inputs.confirm != 'destroy'
        run: |
          echo '::error::確認入力が "destroy" と一致しません。削除を中止します。'
          exit 1

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Install before the AWS credentials, so the download and unpacking run without them
      - name: Install OpenTofu
        uses: ./.github/actions/install-tofu

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # The order (workstations, then network) lives in the script, so any CI that runs it behaves the same
      - name: Destroy
        run: scripts/tofu-destroy.sh
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
