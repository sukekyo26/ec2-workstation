name: Destroy (CDK)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '削除を実行するには "destroy" と入力してください'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

# Serialize with the deploy workflows so apply/destroy never run concurrently
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  destroy:
    name: CDK Destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - name: Validate confirmation input
        if: inputs.confirm != 'destroy'
        run: |
          echo '::error::確認入力が "destroy" と一致しません。削除を中止します。'
          exit 1

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: cdk/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cdk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: CDK Destroy (all stacks)
        run: pnpm destroy:all
