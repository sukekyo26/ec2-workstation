name: Deploy (OpenTofu)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize with the destroy workflow so apply/destroy never run concurrently
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentofu
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Init
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ec2-workstation/dev/terraform.tfstate" \
            -backend-config="region=ap-northeast-1"

      - name: Plan
        run: tofu plan -input=false -out=tfplan

      - name: Apply
        run: tofu apply -input=false tfplan
