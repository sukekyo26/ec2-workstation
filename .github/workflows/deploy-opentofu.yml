name: Deploy (OpenTofu)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize with the destroy workflow so apply/destroy never run concurrently
concurrency:
  group: aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          # The wrapper adds its own lines to stdout, and the script pipes tofu show/console output into jq
          tofu_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # The order (network, then workstations) and the plan-then-apply rule live in the script,
      # so any CI that runs it behaves the same
      - name: Deploy
        run: scripts/tofu-deploy.sh
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
